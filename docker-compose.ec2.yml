# ==============================================================================
# Docker Compose: EC2 Single-VM Lift-and-Shift Deployment
# Course: IT457 Cloud Computing | Group: 35
# Assignee: Member 2 (Cloud Infrastructure Lead)
# ==============================================================================
# In Phase A (Lift-and-Shift), both the stateless web application and the
# stateful database engine run on the SAME single EC2 Virtual Machine.
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netflix-liftshift-web
    restart: always
    ports:
      - "${WEB_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-netflix_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-change_me_please}
      - DB_SSLMODE=prefer
      - DEPLOYMENT_ENV=EC2-Lift-and-Shift
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:15-alpine
    container_name: netflix-liftshift-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-netflix_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_please}
    volumes:
      - ec2_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-netflix_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ec2_pgdata:
    driver: local

